[project]
name = "chainforensics-ai"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0"
]

[tool.vercel]
entrypoint = "app.main:app"
